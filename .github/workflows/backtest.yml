name: Backtest calistir

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Sembol"
        required: true
        default: "BTC-USDT-SWAP"
        type: choice
        options:
          - BTC-USDT-SWAP
          - ETH-USDT-SWAP
      entry_timeframe:
        description: "Giris zaman dilimi"
        required: true
        default: "4H"
        type: choice
        options:
          - "15m"
          - "4H"
          - "1D"
      start:
        description: "Baslangic tarihi (YYYY-MM-DD)"
        required: true
      end:
        description: "Bitis tarihi (YYYY-MM-DD, bos = bugun)"
        required: false
      balance:
        description: "Baslangic bakiyesi (USDT)"
        required: false
        default: "10000"
      margin:
        description: "Islem basi marjin (USDT)"
        required: false
        default: "500"
      leverage:
        description: "Kaldirac"
        required: false
        default: "5"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Backtest calistir ve panele yayinla
        run: |
          python cli.py backtest \
            --symbol "${{ inputs.symbol }}" \
            --entry-timeframe "${{ inputs.entry_timeframe }}" \
            --start "${{ inputs.start }}" \
            ${{ inputs.end != '' && format('--end {0}', inputs.end) || '' }} \
            --balance "${{ inputs.balance }}" \
            --margin "${{ inputs.margin }}" \
            --leverage "${{ inputs.leverage }}" \
            --publish

      - name: Commit sonuclari
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/backtests/
          git diff --cached --quiet || git commit -m "Add backtest run for ${{ inputs.symbol }} ${{ inputs.entry_timeframe }} [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
