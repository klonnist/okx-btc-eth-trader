name: Canli tarama (sanal hesap)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: run-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - profile: 15m
            timeframe: "15m"
            leverage: 10
          - profile: 4h
            timeframe: "4H"
            leverage: 5
          - profile: 1d
            timeframe: "1D"
            leverage: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scan ${{ matrix.profile }}
        run: |
          python runner.py --profile ${{ matrix.profile }} --timeframe ${{ matrix.timeframe }} --leverage ${{ matrix.leverage }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/${{ matrix.profile }}/state.json
          git diff --cached --quiet || git commit -m "Update ${{ matrix.profile }} account state [skip ci]"
          git pull --rebase origin main
          git push
